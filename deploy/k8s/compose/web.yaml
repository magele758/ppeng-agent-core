apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: ppeng-agent-core
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ppeng-agent-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ppeng-agent-core
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ppeng-agent-core
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: ppeng-agent-core
    spec:
      containers:
        - name: web
          image: ghcr.io/magele758/ppeng-agent-core/web:nightly
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 33815
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "33815"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: DAEMON_PROXY_TARGET
              value: http://daemon:37070
          envFrom:
            - secretRef:
                name: ppeng-runtime
                optional: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: ppeng-agent-core
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ppeng-agent-core
spec:
  type: NodePort
  ports:
    - name: http
      port: 33815
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: ppeng-agent-core
    app.kubernetes.io/component: web
