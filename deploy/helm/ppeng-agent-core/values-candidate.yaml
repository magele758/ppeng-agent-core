# Candidate (B) release — deploy:
# helm upgrade --install ppeng-candidate ./deploy/helm/ppeng-agent-core -f values-candidate.yaml

replicaCount: 1

image:
  daemon:
    repository: ppeng-agent-core/daemon
    tag: candidate
    pullPolicy: IfNotPresent
  web:
    repository: ppeng-agent-core/web
    tag: candidate
    pullPolicy: IfNotPresent

web:
  replicaCount: 1
  port: 33815
  env:
    DAEMON_PROXY_TARGET: http://ppeng-candidate-ppeng-agent-core-daemon:37070
    NODE_ENV: production

daemon:
  replicaCount: 1
  port: 37070
  env:
    RAW_AGENT_STATE_DIR: /data/state
    RAW_AGENT_DAEMON_HOST: "0.0.0.0"
    RAW_AGENT_DAEMON_PORT: "37070"
    RAW_AGENT_RELEASE_ROLE: candidate
    RAW_AGENT_RELEASE_RUN_ID: ""

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""
  accessMode: ReadWriteOnce

secret:
  create: true

service:
  daemon:
    type: ClusterIP
    port: 37070
  web:
    type: ClusterIP
    port: 33815
