id: ops-console
title: 运维页：系统健康总览与轨迹浏览
status: approved
requirement: |
  控制台「运维」区要清晰：健康状况一眼可见；会话轨迹（trace / trajectory）容易浏览与筛选；
  自愈与 Evolution 状态看得懂；有效配置可读。减少噪音，渐进披露（默认摘要，需要时再展开细节）。
owner: WS4 Ops
notes: 用户已授权 worker 直接批准并开工（ui-redesign 并行工作流）。
criteria:
  - id: AC-1
    given: 用户打开「运维 → 系统健康」
    when: 页面加载完成
    then: 页面顶部给出一个总体状态（正常 / 需要关注 / 异常）和一句话说明，其下依次是服务、自愈、Evolution 三张状态卡片，每张卡片用文字（而不是裸数字）写明当前状态，如「运行中 2 个」「空闲」
  - id: AC-2
    given: 用户在「系统健康」页
    when: 点击「一键诊断」
    then: 页面运行诊断并显示通过 / 警告 / 失败的数量；有警告或失败时，这些项排在最前并带处理建议，全部通过的项默认收起；全部通过时显示「一切正常」
  - id: AC-3
    given: 用户在「会话轨迹」页并有多个会话
    when: 在筛选框输入关键词（标题、Agent 或 ID）
    then: 会话列表只保留匹配的会话；没有匹配时显示「没有匹配的会话」说明
  - id: AC-4
    given: 用户选中一个有 trace 的会话
    when: 查看轨迹
    then: 顶部先显示摘要（轮次数、出错轮次数、总耗时、工具调用数）；每一轮默认只显示一行摘要（耗时、事件数、工具数、是否出错），事件载荷需要点击展开后才显示
  - id: AC-5
    given: 选中的会话里既有正常轮次也有出错轮次
    when: 打开「只看出错」开关
    then: 只剩出错的轮次；关闭后恢复全部；没有出错轮次时显示「没有出错的轮次」
  - id: AC-6
    given: 用户在轨迹页输入事件类型关键词（如 tool）
    when: 筛选生效
    then: 每一轮只列出事件类型匹配的事件，没有任何匹配时显示「没有匹配的事件」说明
  - id: AC-7
    given: 用户在「系统健康」页查看「有效配置」
    when: 页面加载完成
    then: 默认只展示运行模式与一行摘要，以及需要注意的项（有警告的项）；点击「显示全部」后才列出所有配置项，再点击可收起
  - id: AC-8
    given: 用户打开 Evolution 观测页
    when: 切换界面语言（中文 / English）
    then: 页面标题、各区块标题、状态标签、空状态与按钮文案随语言切换，不再出现硬编码的单一语言文字
