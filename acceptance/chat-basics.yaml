id: chat-basics
title: 对话基础体验
status: implemented
requirement: |
  在 Lab 控制台里和 Agent 对话：发出的消息马上看得到，回复边生成边显示，
  会话留在列表里，刷新后还能接着看历史。
criteria:
  - id: AC-1
    given: 用户在对话页输入了一条消息
    when: 点击发送
    then: 用户消息立刻出现在对话流中，输入框被清空，助手位置先显示「…」等待占位，不必等模型回复
  - id: AC-2
    given: 用户已发送一条消息
    when: 模型开始生成回复
    then: 回复以流式逐步到达界面，生成结束后完整保留在对话中
  - id: AC-3
    given: 用户在新对话里发出第一条消息
    when: 本轮回复完成
    then: 这个会话出现在侧边会话列表中，标题取自用户消息
  - id: AC-4
    given: 已有一段完成的对话
    when: 用户刷新页面并从会话列表重新打开它
    then: 之前的用户消息和助手回复都还在
  - id: AC-5
    given: 一轮回复正在流式生成
    when: 用户关闭页面或断开连接
    then: 这轮运行被取消，不再继续调用上游模型；只是旁观同一轮的连接断开不会取消别人的运行
