id: upstream-resilience
title: 上游模型异常时的稳健性
status: implemented
requirement: |
  上游模型服务出各种状况（输出被截断、连接中断、限流、卡住不动）时，
  用户看到的是准确的结果或明确的错误，不会把半截回答当成完整回答，也不会看到重复的文字。
criteria:
  - id: AC-1
    given: 上游因为输出长度上限截断了回复
    when: 本轮结束
    then: 已生成的内容保留，本轮被标记为「被截断」而不是当作完整回答
  - id: AC-2
    given: 上游在回复中途断开连接或提前结束流
    when: 本轮结束
    then: 本轮报错而不是假装回答完整，已流出的部分文字仍然可见
  - id: AC-3
    given: 一次失败的尝试已经向界面流出了部分文字
    when: 系统自动重试或切换模型
    then: 界面先丢弃这段作废的文字再显示新的回复，不会出现重复拼接；没流出文字时不做多余的清空
  - id: AC-4
    given: 上游限流并告知需要等待的时间
    when: 系统重试
    then: 至少等到上游要求的时间再重试；要求等待的时间超过上限时立即失败而不是长时间挂起
  - id: AC-5
    given: 上游连接已建立但长时间不再发送任何数据
    when: 超过本轮时限
    then: 本轮以超时结束，已流出的部分文字仍然可见
  - id: AC-6
    given: 一轮回复正在等待上游
    when: 用户中止本轮
    then: 上游请求被立即取消，连接被释放
