id: console-knowledge
title: 知识与记忆：分层记忆、搜索与摄取设置
status: approved
requirement: |
  apps/web-console 前端很乱：功能堆在一起，配置太多不好用，交互不清晰。目标是整体重构，让控制台清晰、易用。
  知识与记忆区要简单：记忆范围有解释、可搜索、可添加/编辑，摄取设置简化并把不常用项放进「高级」，空状态要有说明。
criteria:
  - id: AC-1
    given: 用户打开「知识与记忆 → 记忆」
    when: 页面加载完成
    then: 列出全部五种记忆范围（会话草稿、会话长期、用户、团队、项目），每个范围都有一句通俗的说明；选中某个范围后只显示该范围的记忆
  - id: AC-2
    given: 当前范围里有多条记忆
    when: 用户在记忆搜索框输入关键词
    then: 只列出键或内容包含该关键词的记忆；没有匹配时显示「没有匹配的记忆」，并提供清除搜索的入口
  - id: AC-3
    given: 用户选中「用户记忆」范围
    when: 填写键和内容并点击「添加」
    then: 新记忆立即出现在列表中，输入框清空；键或内容为空时「添加」不可用
  - id: AC-4
    given: 列表中已有一条记忆
    when: 用户点击「编辑」修改内容并保存，或点击「删除」并确认
    then: 保存后列表显示新内容；删除后该条从列表中消失
  - id: AC-5
    given: 所选范围里还没有任何记忆
    when: 用户查看记忆列表
    then: 显示说明性的空状态（该范围存什么、怎么产生记忆），而不是空白
  - id: AC-6
    given: 用户未开启「显示高级」
    when: 查看「记忆」页的行为设置
    then: 只看到常用设置（自动从对话中学习）；Dreamer、上下文编译、向量召回、最近观测与上下文预览只在开启「显示高级」后出现
  - id: AC-7
    given: 用户未开启「显示高级」
    when: 打开「知识与记忆 → 摄取」
    then: 只看到「附件摄取」与「浏览器」两个常用开关，每个开关都有一句说明；GBK 回退与网页搜索地址只在开启「显示高级」后出现
