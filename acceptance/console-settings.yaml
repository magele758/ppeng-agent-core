id: console-settings
title: 设置页渐进披露与搜索
status: implemented
requirement: |
  配置太多不好用。设置要默认简单、分组清晰、可搜索，不常用的放到「高级」。
criteria:
  - id: AC-1
    given: 用户打开「设置」页且未开启「显示高级」
    when: 浏览任一分类
    then: 只看到常用设置，高级设置不显示；打开「显示高级」后高级设置出现
  - id: AC-2
    given: 用户在设置页搜索框输入关键词
    when: 关键词匹配某些设置的标题或同义词（含高级设置）
    then: 只列出匹配的设置并标注所属分类；命中的高级设置自动显示，无需先开启「显示高级」
  - id: AC-3
    given: 用户搜索一个不存在的关键词
    when: 没有任何设置匹配
    then: 显示「没有匹配的设置」说明，而不是空白页
  - id: AC-4
    given: 用户已开启「显示高级」
    when: 刷新页面
    then: 该偏好保持，高级设置仍然显示
