id: model-fallback
title: 备用模型自动切换
status: implemented
requirement: |
  主模型的上游临时故障时，对话能自动换到用户事先排好顺序的备用模型继续完成，
  而不是直接报错；鉴权这类不是临时性的错误不应被掩盖。
criteria:
  - id: AC-1
    given: 已配置多个模型
    when: 用户在 Lab「更多」页按顺序添加备用模型并保存
    then: 保存立即生效，刷新页面后顺序仍保留
  - id: AC-2
    given: 用户想把一个未配置的模型加入备用链
    when: 保存
    then: 请求被拒绝，并说明该模型未配置
  - id: AC-3
    given: 备用链已配置
    when: 主模型上游返回临时故障（如 503）
    then: 本轮自动切到备用模型完成回复，并在轨迹中记录切换；下一轮仍从主模型开始
  - id: AC-4
    given: 备用链已配置
    when: 主模型返回鉴权失败（401）这类非临时错误
    then: 不切换备用模型，直接把原始错误告诉用户
  - id: AC-5
    given: 备用链已配置
    when: 主模型和所有备用模型都失败
    then: 用户看到第一个错误及每个模型的尝试摘要
  - id: AC-6
    given: 主模型失败后正准备切换
    when: 用户中止本轮
    then: 不再尝试后续备用模型
