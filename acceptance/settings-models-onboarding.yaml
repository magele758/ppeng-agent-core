id: settings-models-onboarding
title: 设置：模型向导、首次引导、搜索与保存状态
status: implemented
owner: WS5 (ui-redesign)
requirement: |
  让配置真正可用：模型配置做成简单的向导流程（选服务商、填 key、选模型、测试连接），
  有合理默认值，高级选项放在开关后面；设置搜索要好用，保存/未保存状态要清楚；
  没配置模型时给首次引导提示；登录页要精致；并增加网关/IM 设置卡片（飞书/企业微信的
  token、encryptKey、secret、发送者白名单、botId），密钥永不回显。
criteria:
  - id: AC-1
    given: 用户还没有配置任何真实模型（只有内置演示模型）
    when: 打开「设置」页
    then: 页面顶部出现首次引导提示，说明尚未配置真实模型，并有一个按钮直达「设置 → 模型」；配置好模型后该提示消失
  - id: AC-2
    given: 用户在「设置 → 模型」添加服务商
    when: 选择一个预设服务商（如 DeepSeek）
    then: 只需要填写 API Key 即可继续，Base URL、协议、名称等不出现在默认视图里
  - id: AC-3
    given: 用户选好服务商并填了 API Key
    when: 点击「测试连接」成功
    then: 显示发现的模型数量并自动选好一个默认模型；点击「保存并使用」后该服务商保存成功，该模型成为默认模型，并显示「已保存」状态
  - id: AC-4
    given: 用户填了错误的 API Key 或网络不通
    when: 点击「测试连接」失败
    then: 显示针对原因的可操作提示（如「API Key 无效，请检查后重试」），不展示堆栈，用户可以修改后重试
  - id: AC-5
    given: 用户处于添加服务商向导
    when: 打开向导里的「高级选项」
    then: 才出现服务商名称、协议、Base URL 以及按模型启用的列表；关闭后重新隐藏
  - id: AC-6
    given: 用户在设置页搜索框输入内容
    when: 输入分类名、同义词（如「key」「飞书」「theme」）或标题的一部分
    then: 列出匹配的设置并标注所属分类、显示匹配数量；点击清除按钮后恢复分类视图
  - id: AC-7
    given: 用户修改了「模型备选」或「网关」设置但还没保存
    when: 查看卡片
    then: 卡片显示「有未保存的修改」并启用保存按钮；保存成功后显示「已保存」状态，未改动时保存按钮不可点
  - id: AC-8
    given: 用户打开「设置 → 集成与可观测」的网关/IM 卡片
    when: 填写飞书 / 企业微信的 token、encryptKey、secret、发送者白名单、Bot 并保存
    then: 只提交用户改动的字段；已设置的密钥只显示「已设置」而不回显明文；留空的密钥保持不变，可以显式清除
  - id: AC-9
    given: 用户打开「设置 → 通用」
    when: 选择浅色、深色或跟随系统主题
    then: 界面立即切换，刷新页面后仍保持该选择
  - id: AC-10
    given: 服务要求登录
    when: 用户未登录访问控制台
    then: 登录页清晰显示可用的登录方式；登录被拒绝或失败时显示明确的错误提示；没有配置任何登录方式时说明如何启用而不是空白
