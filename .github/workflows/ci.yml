# 每次 push / PR：release-gate.yml（构建 + 单元/回归/集成/E2E + agent-loop vitest + CRAP 门禁，无需密钥）
# 可选：配置 Repository secrets 后，额外跑真模型冒烟（OpenAI 兼容或 Anthropic）

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 构建、单元/回归/集成/E2E、agent-loop vitest、CRAP 门禁都在 release-gate.yml，
  # 对外只暴露一个检查「Release gate / Main release gate」，供 main 分支保护设为 required。
  release-gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml


  # secrets 上下文不能在 job 级 if 中使用（会报 "Unrecognized named-value: 'secrets'" 使整个 run 立即失败）。
  # 这里用一个 gate job 把「是否配置了 API Key」算成布尔 output，供下游 job 的 if 引用。
  secrets-gate:
    name: Check remote-smoke secrets
    runs-on: ubuntu-latest
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - name: Detect RAW_AGENT_API_KEY
        id: check
        env:
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
        run: |
          if [ -n "$RAW_AGENT_API_KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
          fi

  # 使用你在 GitHub 配置的 Secrets 调用真实第三方 API（见 docs/CI.md）
  remote-model-smoke:
    name: Remote model smoke (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-gate, secrets-gate]
    # 至少提供 API Key；OpenAI 兼容还需 BASE_URL + MODEL_NAME（可在 Secrets 中一并配置）
    if: ${{ github.event.repository.fork == false && needs.secrets-gate.outputs.has-key == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Remote smoke (OpenAI-compatible)
        if: ${{ vars.RAW_AGENT_CI_PROVIDER != 'anthropic-compatible' }}
        run: npm run test:remote
        env:
          RAW_AGENT_MODEL_PROVIDER: openai-compatible
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
          RAW_AGENT_BASE_URL: ${{ secrets.RAW_AGENT_BASE_URL }}
          RAW_AGENT_MODEL_NAME: ${{ secrets.RAW_AGENT_MODEL_NAME }}
          RAW_AGENT_USE_JSON_MODE: ${{ vars.RAW_AGENT_USE_JSON_MODE }}

      - name: Remote smoke (Anthropic-compatible)
        if: ${{ vars.RAW_AGENT_CI_PROVIDER == 'anthropic-compatible' }}
        run: npm run test:remote
        env:
          RAW_AGENT_MODEL_PROVIDER: anthropic-compatible
          RAW_AGENT_API_KEY: ${{ secrets.RAW_AGENT_API_KEY }}
          RAW_AGENT_ANTHROPIC_URL: ${{ secrets.RAW_AGENT_ANTHROPIC_URL }}
          RAW_AGENT_BASE_URL: ${{ secrets.RAW_AGENT_BASE_URL }}
          RAW_AGENT_MODEL_NAME: ${{ secrets.RAW_AGENT_MODEL_NAME }}
