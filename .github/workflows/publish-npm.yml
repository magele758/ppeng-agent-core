# 发布 @mage-ai-lab/api-types 与 @mage-ai-lab/agent-loop。
# 不跟普通 push / PR。手动：Actions → Publish npm → Run workflow。
# 打 tag npm-v<version>（须与两个 package.json 的 version 一致）也会发布。

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack only, do not publish
        type: boolean
        default: false
  push:
    tags:
      - "npm-v*"

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # Fail closed: the same revision must pass the reusable gate before publishing.
  release-gate:
    name: Release gate
    if: ${{ github.event.repository.fork == false }}
    uses: ./.github/workflows/release-gate.yml

  # Only publish after the same revision passes the release gate.
  publish:
    name: Publish @mage-ai-lab packages
    needs: release-gate
    if: ${{ github.event.repository.fork == false && needs.release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gate status
        env:
          GATE: ${{ needs.release-gate.result }}
        run: |
          echo "release_gate=${GATE} mode=enforce" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node scripts/publish-npm-packages.mjs
