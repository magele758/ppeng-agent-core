# 发布 @mage-ai-lab/api-types 与 @mage-ai-lab/agent-loop。
# 不跟普通 push / PR。手动：Actions → Publish npm → Run workflow。
# 打 tag npm-v<version>（须与两个 package.json 的 version 一致）也会发布。

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack only, do not publish
        type: boolean
        default: false
  push:
    tags:
      - "npm-v*"

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release-gate:
    name: Release gate
    if: ${{ github.event.repository.fork == false }}
    uses: ./.github/workflows/release-gate.yml

  # 始终等 release gate 结束。仓库 Variable RELEASE_GATE_ENFORCE=true 时 gate 不绿就不发；
  # 未设置 / 其它值为观察模式：gate 失败只告警，照常发布（见 doc/CI.md）。取消运行时不发。
  publish:
    name: Publish @mage-ai-lab packages
    needs: release-gate
    if: >-
      !cancelled() && github.event.repository.fork == false &&
      (vars.RELEASE_GATE_ENFORCE != 'true' || needs.release-gate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gate status
        env:
          MODE: ${{ vars.RELEASE_GATE_ENFORCE == 'true' && 'enforce' || 'observe' }}
          GATE: ${{ needs.release-gate.result }}
        run: |
          echo "release_gate=${GATE} mode=${MODE}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$GATE" != "success" ]; then
            echo "::warning title=Release gate (observe)::Publishing despite release_gate=${GATE}; set RELEASE_GATE_ENFORCE=true to block"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_PUBLISH_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node scripts/publish-npm-packages.mjs
