# 合入 main（镜像相关路径）或每天定时推一组「最新」镜像到 GHCR；nightly 已是当前 SHA 则跳过。
# 流程：构建并 load 到 runner（不推）→ 起容器跑 scripts/deploy-smoke.mjs（启发式模型、临时 state）→ 再推 tag。
# 卡点开关：仓库 Variable RELEASE_GATE_ENFORCE=true 时，release gate 或部署冒烟失败都不推；
# 未设置 / 其它值为观察模式，失败只出 warning + step summary，照常推送（见 doc/CI.md）。
# PR 只构建 + 冒烟，不登录 GHCR、不推送。
# 不含 Evolution / 真模型 / 桌面 DMG。手动重打：Actions → Docker nightly → Run workflow → force.

name: Docker nightly

on:
  schedule:
    # 16:00 UTC = 北京时间 00:00
    - cron: '0 16 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/docker-nightly.yml'
      - 'scripts/docker-nightly-should-build.mjs'
      - 'deploy/docker/**'
      - 'apps/daemon/**'
      - 'apps/cli/**'
      - 'apps/web-console/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.base.json'
      - 'domains.manifest.json'
      - 'scripts/build-workspace.mjs'
      - 'scripts/lib/**'
      - 'scripts/deploy-smoke.mjs'
  workflow_dispatch:
    inputs:
      force:
        description: Ignore existing nightly SHA and rebuild
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/docker-nightly.yml'
      - 'scripts/docker-nightly-should-build.mjs'
      - 'deploy/docker/Dockerfile.daemon'
      - 'deploy/docker/Dockerfile.web'
      - 'scripts/deploy-smoke.mjs'
      - 'scripts/lib/deploy-smoke-lib.mjs'
      - 'scripts/test/deploy-smoke-lib.test.mjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  self-test:
    name: Skip-logic self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decide helper self-test
        run: node scripts/docker-nightly-should-build.mjs --self-test

      - name: Deploy smoke unit tests
        run: node --test scripts/test/deploy-smoke-lib.test.mjs

  decide:
    name: Skip if nightly already this SHA
    needs: self-test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      reason: ${{ steps.decide.outputs.reason }}
      image_prefix: ${{ steps.meta.outputs.image_prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image prefix
        id: meta
        run: |
          prefix="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_prefix=${prefix}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read nightly revision labels
        id: labels
        env:
          IMAGE_PREFIX: ${{ steps.meta.outputs.image_prefix }}
        run: |
          set +e
          daemon_rev=""
          web_rev=""
          if docker pull "${IMAGE_PREFIX}/daemon:nightly"; then
            daemon_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_PREFIX}/daemon:nightly")"
          fi
          if docker pull "${IMAGE_PREFIX}/web:nightly"; then
            web_rev="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${IMAGE_PREFIX}/web:nightly")"
          fi
          set -e
          {
            echo "daemon_rev=${daemon_rev}"
            echo "web_rev=${web_rev}"
          } >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          DOCKER_NIGHTLY_SHA: ${{ github.sha }}
          DOCKER_NIGHTLY_DAEMON_REV: ${{ steps.labels.outputs.daemon_rev }}
          DOCKER_NIGHTLY_WEB_REV: ${{ steps.labels.outputs.web_rev }}
          DOCKER_NIGHTLY_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' }}
        run: node scripts/docker-nightly-should-build.mjs >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "should_build=${{ steps.decide.outputs.should_build }} reason=${{ steps.decide.outputs.reason }} sha=${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  release-gate:
    name: Release gate
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    uses: ./.github/workflows/release-gate.yml

  # 构建 → 本地起容器 → 部署冒烟；镜像以 tar 交给 push job，保证推的就是冒烟过的那份。
  build:
    name: Build images + deploy smoke
    needs: [self-test, decide]
    if: >-
      !cancelled() && needs.self-test.result == 'success' &&
      (github.event_name == 'pull_request' || needs.decide.outputs.should_build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      smoke: ${{ steps.smoke.outcome }}
    env:
      IMAGE_PREFIX: ${{ needs.decide.outputs.image_prefix || 'ppeng-agent-core-pr' }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      # PR 是 Dockerfile 自测，冒烟失败直接红；发布路径听 RELEASE_GATE_ENFORCE。
      ENFORCE: ${{ github.event_name == 'pull_request' || vars.RELEASE_GATE_ENFORCE == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Created timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build daemon (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.daemon
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/daemon:nightly
            ${{ env.IMAGE_PREFIX }}/daemon:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=docker-nightly-daemon
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=docker-nightly-daemon' || '' }}

      - name: Build web (load, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.web
          load: true
          push: false
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_PREFIX }}/web:nightly
            ${{ env.IMAGE_PREFIX }}/web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=docker-nightly-web
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max,scope=docker-nightly-web' || '' }}

      - name: Start stack (heuristic model, ephemeral state)
        run: |
          token="$(openssl rand -hex 24)"
          echo "::add-mask::${token}"
          echo "SMOKE_TOKEN=${token}" >> "$GITHUB_ENV"
          docker network create deploy-smoke
          docker run -d --name smoke-daemon --network deploy-smoke --network-alias daemon \
            -e RAW_AGENT_MODEL_PROVIDER=heuristic \
            -e RAW_AGENT_AUTH_TOKEN="${token}" \
            -e RAW_AGENT_STATE_DIR=/tmp/agent-state \
            -e RAW_AGENT_SELF_HEAL_AUTO_START=0 \
            -p 127.0.0.1:37070:37070 \
            "${IMAGE_PREFIX}/daemon:nightly"
          docker run -d --name smoke-web --network deploy-smoke \
            -e DAEMON_PROXY_TARGET=http://daemon:37070 \
            -e RAW_AGENT_AUTH_TOKEN="${token}" \
            -p 127.0.0.1:33815:33815 \
            "${IMAGE_PREFIX}/web:nightly"

      - name: Deploy smoke
        id: smoke
        continue-on-error: true
        run: >-
          node scripts/deploy-smoke.mjs
          --daemon-url http://127.0.0.1:37070
          --web-url http://127.0.0.1:33815
          --token "$SMOKE_TOKEN"
          --expect-adapter heuristic
          --startup-timeout-ms 120000
          --json-out "$RUNNER_TEMP/deploy-smoke.json"
          > /dev/null

      - name: Container logs
        if: ${{ !cancelled() && steps.smoke.outcome == 'failure' }}
        run: |
          docker ps -a
          docker logs --tail 200 smoke-daemon || true
          docker logs --tail 200 smoke-web || true

      - name: Smoke verdict
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            exit 0
          fi
          if [ "$ENFORCE" = "true" ]; then
            echo "::error title=Deploy smoke::Deploy smoke failed (${OUTCOME}); images will not be pushed"
            echo "**Deploy smoke failed — push blocked.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::warning title=Deploy smoke::Deploy smoke failed (${OUTCOME}); observe mode, images will still be pushed"
          echo "**Deploy smoke failed — observe mode, push continues.** Set repository variable \`RELEASE_GATE_ENFORCE=true\` to block." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke summary
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-smoke
          path: ${{ runner.temp }}/deploy-smoke.json
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Save images for push
        if: env.PUBLISH == 'true'
        run: |
          docker save \
            "${IMAGE_PREFIX}/daemon:nightly" "${IMAGE_PREFIX}/daemon:latest" \
            "${IMAGE_PREFIX}/web:nightly" "${IMAGE_PREFIX}/web:latest" \
            | gzip -1 > "$RUNNER_TEMP/nightly-images.tar.gz"

      - name: Upload images
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-images
          path: ${{ runner.temp }}/nightly-images.tar.gz
          retention-days: 1
          compression-level: 0
          overwrite: true

      - name: Stop stack
        if: always()
        run: docker rm -f smoke-web smoke-daemon >/dev/null 2>&1 || true

  # 始终等 release gate 结束；观察模式下 gate / 冒烟失败只告警，卡点模式下不推。
  push:
    name: Push nightly images
    needs: [decide, release-gate, build]
    if: >-
      !cancelled() && needs.decide.outputs.should_build == 'true' && needs.build.result == 'success' &&
      (vars.RELEASE_GATE_ENFORCE != 'true' ||
       (needs.release-gate.result == 'success' && needs.build.outputs.smoke == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_PREFIX: ${{ needs.decide.outputs.image_prefix }}
    steps:
      - name: Gate status
        env:
          MODE: ${{ vars.RELEASE_GATE_ENFORCE == 'true' && 'enforce' || 'observe' }}
          GATE: ${{ needs.release-gate.result }}
          SMOKE: ${{ needs.build.outputs.smoke }}
        run: |
          echo "release_gate=${GATE} deploy_smoke=${SMOKE} mode=${MODE}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$GATE" != "success" ] || [ "$SMOKE" != "success" ]; then
            echo "::warning title=Release gate (observe)::Pushing despite release_gate=${GATE} deploy_smoke=${SMOKE}; set RELEASE_GATE_ENFORCE=true to block"
          fi

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: nightly-images
          path: ${{ runner.temp }}

      - name: Load images
        run: gunzip -c "$RUNNER_TEMP/nightly-images.tar.gz" | docker load

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          for image in daemon web; do
            for tag in nightly latest; do
              docker push "${IMAGE_PREFIX}/${image}:${tag}"
            done
          done
